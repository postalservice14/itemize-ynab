version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - bodyclose
    - noctx
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # The throwaway spike prints to stdout by design.
      - path: cmd/spike-walmart/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
